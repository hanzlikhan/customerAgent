# Sync this repo to the Hugging Face Space (DukaanAI backend) on every
# push to main. The Space rebuilds its Docker image automatically.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   HF_TOKEN  - Hugging Face access token with write access
#   HF_SPACE  - "<hf-username>/dukaanai-api" (no URL, no .git)
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          git push "https://hf-user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}.git" main:main --force
